# Baut die Mod und laesst die Tests laufen. Das ist der einzige Ort, an dem
# sich beweisen laesst, dass der Code uebersetzt — Fabric braucht Java 25 und
# die Fabric-Maven, beides gibt es nur hier.
name: bauen

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-24.04
    steps:
      - name: auschecken
        uses: actions/checkout@v6

      - name: gradle-wrapper pruefen
        uses: gradle/actions/wrapper-validation@v6

      - name: jdk 25 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: gradle zwischenspeichern
        uses: gradle/actions/setup-gradle@v6

      - name: bauen und testen
        run: ./gradlew build --stacktrace

      # Ein Lauf ohne ausgefuehrte Tests wuerde sonst gruen melden.
      - name: testergebnis zusammenfassen
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          dateien = glob.glob('build/test-results/test/TEST-*.xml')
          if not dateien:
              sys.exit('Keine Testergebnisse gefunden - es lief kein einziger Test.')
          gesamt = fehler = uebersprungen = 0
          for d in sorted(dateien):
              w = ET.parse(d).getroot()
              n = int(w.get('tests', 0))
              f = int(w.get('failures', 0)) + int(w.get('errors', 0))
              u = int(w.get('skipped', 0))
              gesamt += n; fehler += f; uebersprungen += u
              print(f"  {w.get('name'):<55} {n:>3} Tests, {f} Fehler")
          print(f"Gesamt: {gesamt} Tests, {fehler} Fehler, {uebersprungen} uebersprungen")
          if gesamt == 0:
              sys.exit('Null Tests ausgefuehrt.')
          if fehler:
              sys.exit(f'{fehler} Test(s) fehlgeschlagen.')
          PY

      - name: testbericht sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testbericht
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: jar sichern
        uses: actions/upload-artifact@v7
        with:
          name: fusion_420
          path: build/libs/*.jar
