# Baut die Mod und laesst die Tests laufen. Das ist der einzige Ort, an dem
# sich beweisen laesst, dass der Code uebersetzt — Fabric braucht Java 25 und
# die Fabric-Maven, beides gibt es nur hier.
name: bauen

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-24.04
    steps:
      - name: auschecken
        uses: actions/checkout@v4

      - name: gradle-wrapper pruefen
        uses: gradle/actions/wrapper-validation@v4

      - name: jdk 25 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: gradle zwischenspeichern
        uses: gradle/actions/setup-gradle@v4

      - name: bauen und testen
        run: ./gradlew build --stacktrace

      - name: testbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: jar sichern
        uses: actions/upload-artifact@v4
        with:
          name: fusion_420
          path: build/libs/*.jar
