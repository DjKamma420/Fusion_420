# Haengt bei einem Tag wie v0.1.0 das gebaute Jar an ein GitHub-Release und
# laedt es zu Modrinth hoch, sobald die noetigen Geheimnisse hinterlegt sind.
name: freigabe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freigeben:
    runs-on: ubuntu-24.04
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
    steps:
      - name: auschecken
        uses: actions/checkout@v6

      - name: gradle-wrapper pruefen
        uses: gradle/actions/wrapper-validation@v6

      - name: jdk 25 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: bauen und testen
        run: ./gradlew build --stacktrace

      # Faengt ein Jar ab, dem Ressourcen, Klassen oder die ersetzte
      # Version fehlen - all das laesst Fabric erst im Spiel scheitern.
      - name: jar pruefen
        run: |
          python3 - <<'PY'
          import glob, json, sys, zipfile

          kandidaten = [j for j in glob.glob('build/libs/*.jar') if '-sources' not in j]
          if not kandidaten:
              sys.exit('Kein Jar in build/libs gebaut.')
          pfad = kandidaten[0]

          with zipfile.ZipFile(pfad) as z:
              namen = set(z.namelist())
              pflicht = [
                  'fabric.mod.json',
                  'fusion_420.mixins.json',
                  'daten/fusion-data.json',
                  'assets/fusion_420/icon.png',
                  'de/kamma/fusion420/Fusion420Client.class',
                  'de/kamma/fusion420/mixin/ContainerScreenZugriff.class',
                  'de/kamma/fusion420/gui/Overlay.class',
                  'de/kamma/fusion420/daten/Rezeptbuch.class',
                  'de/kamma/fusion420/markt/Bazaar.class',
                  'de/kamma/fusion420/rechner/Gewinnrechner.class',
              ]
              fehlend = [p for p in pflicht if p not in namen]
              if fehlend:
                  sys.exit('Im Jar fehlen: ' + ', '.join(fehlend))

              beschreibung = json.loads(z.read('fabric.mod.json'))
              if beschreibung['id'] != 'fusion_420':
                  sys.exit('Falsche Mod-Kennung: ' + beschreibung['id'])
              # processResources muss ${version} ersetzt haben; sonst startet Fabric nicht.
              if '$' in beschreibung['version']:
                  sys.exit('Version wurde nicht eingesetzt: ' + beschreibung['version'])
              einstieg = beschreibung['entrypoints']['client'][0]
              if einstieg.replace('.', '/') + '.class' not in namen:
                  sys.exit('Einstiegsklasse fehlt im Jar: ' + einstieg)

              # Die Rezeptdatei muss vollstaendig sein, nicht nur vorhanden.
              daten = json.loads(z.read('daten/fusion-data.json'))
              shards = len(daten['shards'])
              if shards < 300:
                  sys.exit('Rezeptdatei unvollstaendig: nur %d Shards' % shards)

              klassen = sum(1 for n in namen if n.endswith('.class'))
              print('Jar:        %s' % pfad.split('/')[-1])
              print('Kennung:    %s  Version %s' % (beschreibung['id'], beschreibung['version']))
              print('Einstieg:   %s' % einstieg)
              print('Mixins:     %s' % ', '.join(
                  m['config'] if isinstance(m, dict) else m for m in beschreibung['mixins']))
              print('Inhalt:     %d Klassen, %d Shards in den Rezeptdaten' % (klassen, shards))
          PY

      - name: version ermitteln
        id: version
        run: echo "nummer=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: github-release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Fusion 420 ${{ steps.version.outputs.nummer }}" \
            --generate-notes \
            build/libs/*.jar

      # Modrinth ist der Weg, ueber den Prism Launcher die Mod direkt findet.
      # Ohne hinterlegtes Geheimnis wird der Schritt still uebersprungen.
      - name: zu modrinth hochladen
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_ID != ''
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          echo "lade hoch: $JAR"
          DATEN=$(jq -n \
            --arg name "Fusion 420 ${{ steps.version.outputs.nummer }}" \
            --arg nummer "${{ steps.version.outputs.nummer }}" \
            --arg projekt "$MODRINTH_ID" \
            '{
              name: $name,
              version_number: $nummer,
              changelog: "Siehe GitHub-Release.",
              dependencies: [],
              game_versions: ["26.1.2"],
              version_type: "release",
              loaders: ["fabric"],
              featured: true,
              project_id: $projekt,
              file_parts: ["datei"],
              primary_file: "datei"
            }')
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=$DATEN;type=application/json" \
            -F "datei=@$JAR;type=application/java-archive"
