# Publishes tagged releases to GitHub Releases and Modrinth.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  MODRINTH_PROJECT_ID: fZBKE4sL

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Validate JAR
        run: |
          python3 - <<'PY'
          import glob, json, sys, zipfile

          candidates = [j for j in glob.glob('build/libs/*.jar') if '-sources' not in j]
          if not candidates:
              sys.exit('No JAR was built in build/libs.')
          path = candidates[0]

          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              required = [
                  'fabric.mod.json',
                  'fusion_420.mixins.json',
                  'daten/fusion-data.json',
                  'assets/fusion_420/icon.png',
                  'de/kamma/fusion420/Fusion420Client.class',
                  'de/kamma/fusion420/mixin/ContainerScreenZugriff.class',
                  'de/kamma/fusion420/gui/Overlay.class',
                  'de/kamma/fusion420/daten/Rezeptbuch.class',
                  'de/kamma/fusion420/markt/Bazaar.class',
                  'de/kamma/fusion420/rechner/Gewinnrechner.class',
                  'de/kamma/fusion420/wartung/Versionspruefung.class',
              ]
              missing = [p for p in required if p not in names]
              if missing:
                  sys.exit('JAR is missing: ' + ', '.join(missing))

              metadata = json.loads(z.read('fabric.mod.json'))
              if metadata['id'] != 'fusion_420':
                  sys.exit('Wrong mod ID: ' + metadata['id'])
              if '$' in metadata['version']:
                  sys.exit('Version was not substituted: ' + metadata['version'])
              entrypoint = metadata['entrypoints']['client'][0]
              if entrypoint.replace('.', '/') + '.class' not in names:
                  sys.exit('Entrypoint class is missing: ' + entrypoint)

              data = json.loads(z.read('daten/fusion-data.json'))
              shards = len(data['shards'])
              if shards < 300:
                  sys.exit('Recipe data appears incomplete: only %d shards' % shards)

              classes = sum(1 for n in names if n.endswith('.class'))
              print('JAR:       %s' % path.split('/')[-1])
              print('Mod ID:    %s  Version %s' % (metadata['id'], metadata['version']))
              print('Entrypoint: %s' % entrypoint)
              print('Contents:  %d classes, %d shards' % (classes, shards))
          PY

      - name: Determine version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Fusion 420 ${{ steps.version.outputs.number }}" \
            --generate-notes \
            build/libs/*.jar

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          echo "Publishing $JAR to Modrinth project $MODRINTH_PROJECT_ID"
          DATA=$(jq -n \
            --arg name "Fusion 420 ${{ steps.version.outputs.number }}" \
            --arg number "${{ steps.version.outputs.number }}" \
            --arg project "$MODRINTH_PROJECT_ID" \
            '{
              name: $name,
              version_number: $number,
              changelog: "See the GitHub release notes.",
              dependencies: [],
              game_versions: ["26.1.2"],
              version_type: "release",
              loaders: ["fabric"],
              featured: true,
              project_id: $project,
              file_parts: ["file"],
              primary_file: "file"
            }')
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=$DATA;type=application/json" \
            -F "file=@$JAR;type=application/java-archive"
