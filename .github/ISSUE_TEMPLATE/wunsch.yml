name: Wunsch
description: Vorschlag für eine Erweiterung
labels: ["wunsch"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll das lösen?
      description: Bitte das Problem beschreiben, nicht schon die Lösung.
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Wie stellst du dir das vor?
