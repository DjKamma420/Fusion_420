name: Bug Report
description: Report something that does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The information below helps avoid follow-up questions.
  - type: input
    id: version
    attributes:
      label: Fusion 420 version
      description: The version is shown in the log after "Fusion 420 ... ready".
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft and loader version
      placeholder: "26.1.2, Fabric 0.19.3"
    validations:
      required: true
  - type: textarea
    id: was
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        Paste the relevant part of the latest file from logs/. Lines containing
        "Fusion 420" are usually useful. Review the log first because it may
        contain player names or other local information.
      render: text
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Especially GUI-heavy mods such as SkyHanni or NEU.
